<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Solidário - Receptores</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topo">
    <div>
        <h1>SOLIDÁRIO</h1>
        <p>Cadastro de Receptores</p>
    </div>

    <div class="usuario-logado">
        <span id="nomeUsuario">Usuário</span>
        <button onclick="voltarMenu()">Voltar ao Menu</button>
    </div>
</header>

<main class="conteudo">

    <div class="cabecalho-modulo">
        <div>
            <h2>Receptores cadastrados</h2>
            <p class="descricao">Cadastre, edite e gerencie pessoas que recebem doações.</p>
        </div>

        <button class="btn btn-verde" onclick="novoCadastro()">Novo Receptor</button>
    </div>

    <section class="card-form" id="formulario" style="display: none;">
        <h3 id="tituloFormulario">Novo Receptor</h3>

        <input type="hidden" id="id">

        <div class="form-grid">
            <div>
                <label>Nome</label>
                <input type="text" id="nome" placeholder="Nome do receptor">
            </div>

            <div>
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>

            <div>
                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="Telefone">
            </div>

            <div>
                <label>E-mail</label>
                <input type="email" id="email" placeholder="email@exemplo.com">
            </div>

            <div class="campo-completo">
                <label>Endereço</label>
                <input type="text" id="endereco" placeholder="Endereço completo">
            </div>

            <div class="campo-completo">
                <label>Observação</label>
                <textarea id="observacao" placeholder="Observações"></textarea>
            </div>
        </div>

        <div class="acoes-form">
            <button class="btn btn-cinza" onclick="cancelar()">Cancelar</button>
            <button class="btn btn-verde" onclick="salvar()">Salvar</button>
        </div>
    </section>

    <section class="card-tabela">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaReceptores">
            </tbody>
        </table>
    </section>

</main>

<script>
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    if (!usuario) {
        window.location.href = "/login";
    } else {
        document.getElementById("nomeUsuario").innerText =
            usuario.nome + " • " + usuario.perfil;
    }

    function voltarMenu() {
        window.location.href = "/menu";
    }

    function novoCadastro() {
        limparFormulario();
        document.getElementById("tituloFormulario").innerText = "Novo Receptor";
        document.getElementById("formulario").style.display = "block";
    }

    function cancelar() {
        limparFormulario();
        document.getElementById("formulario").style.display = "none";
    }

    function limparFormulario() {
        document.getElementById("id").value = "";
        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("email").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("observacao").value = "";
    }

    function carregarReceptores() {
        fetch("/receptores")
            .then(response => response.json())
            .then(receptores => {
                const tabela = document.getElementById("tabelaReceptores");
                tabela.innerHTML = "";

                receptores.forEach(receptor => {
                    tabela.innerHTML += `
                        <tr>
                            <td>${receptor.id}</td>
                            <td>${receptor.nome ?? ""}</td>
                            <td>${receptor.cpf ?? ""}</td>
                            <td>${receptor.telefone ?? ""}</td>
                            <td>${receptor.email ?? ""}</td>
                            <td>
                                <button class="btn-tabela btn-azul" onclick="editar(${receptor.id})">Editar</button>
                                <button class="btn-tabela btn-vermelho" onclick="excluir(${receptor.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                alert("Erro ao carregar receptores: " + error.message);
            });
    }

    function salvar() {
        const id = document.getElementById("id").value;

        const receptor = {
            nome: document.getElementById("nome").value,
            cpf: document.getElementById("cpf").value,
            telefone: document.getElementById("telefone").value,
            email: document.getElementById("email").value,
            endereco: document.getElementById("endereco").value,
            observacao: document.getElementById("observacao").value
        };

        const url = id ? `/receptores/${id}` : "/receptores";
        const metodo = id ? "PUT" : "POST";

        fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(receptor)
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(texto => {
                        throw new Error(texto || "Erro ao salvar receptor.");
                    });
                }
            })
            .then(() => {
                cancelar();
                carregarReceptores();
            })
            .catch(error => {
                alert("Erro ao salvar receptor: " + error.message);
            });
    }

    function editar(id) {
        fetch(`/receptores/${id}`)
            .then(response => response.json())
            .then(receptor => {
                document.getElementById("id").value = receptor.id;
                document.getElementById("nome").value = receptor.nome ?? "";
                document.getElementById("cpf").value = receptor.cpf ?? "";
                document.getElementById("telefone").value = receptor.telefone ?? "";
                document.getElementById("email").value = receptor.email ?? "";
                document.getElementById("endereco").value = receptor.endereco ?? "";
                document.getElementById("observacao").value = receptor.observacao ?? "";

                document.getElementById("tituloFormulario").innerText = "Editar Receptor";
                document.getElementById("formulario").style.display = "block";
            })
            .catch(error => {
                alert("Erro ao buscar receptor: " + error.message);
            });
    }

    function excluir(id) {
        if (!confirm("Deseja realmente excluir este receptor?")) {
            return;
        }

        fetch(`/receptores/${id}`, {
            method: "DELETE"
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Não foi possível excluir o receptor.");
                }

                carregarReceptores();
            })
            .catch(error => {
                alert("Erro ao excluir receptor: " + error.message);
            });
    }

    carregarReceptores();
</script>

</body>
</html>
